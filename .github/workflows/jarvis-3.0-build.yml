name: JARVIS 3.0 APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/jarvis-extracted"
          mkdir -p "$DEST"

          # Extract ZIP files uploaded to the repository.
          while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -oq "$file" -d "$DEST"
          done < <(
            find "$ROOT" -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

          # Search both the repository and extracted archives.
          PROJECT=""
          for BASE in "$ROOT" "$DEST"; do
            while IFS= read -r -d '' settings; do
              DIR="$(dirname "$settings")"

              if [ -f "$DIR/build.gradle" ] &&
                 [ -f "$DIR/app/build.gradle" ] &&
                 [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
                PROJECT="$DIR"
                break 2
              fi
            done < <(
              find "$BASE" -type f -name settings.gradle \
                -not -path '*/.git/*' \
                -not -path '*/build/*' -print0
            )
          done

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found. Upload the project source ZIP or its extracted files."
            echo "Repository files:"
            find "$ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-3.0-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
