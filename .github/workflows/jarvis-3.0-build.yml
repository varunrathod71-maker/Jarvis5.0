name: JARVIS 3.0 APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Find project and build APK
        shell: bash
        run: |
          set -euo pipefail

          SEARCH="$RUNNER_TEMP/jarvis-search"
          mkdir -p "$SEARCH"

          # Search the repository and extract uploaded ZIPs.
          while IFS= read -r -d '' z; do
            echo "Extracting $z"
            unzip -oq "$z" -d "$SEARCH"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

          PROJECT=""

          for BASE in "$GITHUB_WORKSPACE" "$SEARCH"; do
            while IFS= read -r -d '' f; do
              D="$(dirname "$f")"

              if [ -f "$D/build.gradle" ] &&
                 [ -f "$D/app/build.gradle" ] &&
                 [ -f "$D/app/src/main/AndroidManifest.xml" ]; then
                PROJECT="$D"
                break 2
              fi
            done < <(
              find "$BASE" -type f -name settings.gradle \
                -not -path '*/.git/*' \
                -not -path '*/build/*' -print0
            )
          done

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found at: $PROJECT"
          cd "$PROJECT"

          gradle --no-daemon --stacktrace clean assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/apk-output/JARVIS-3.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-3.0-debug-apk
          path: apk-output/JARVIS-3.0.apk
          if-no-files-found: error
          retention-days: 7
